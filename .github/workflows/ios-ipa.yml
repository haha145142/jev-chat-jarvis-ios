name: Build iOS IPA

# 在云端 Mac 上编译「未签名 IPA」并发到 Release；失败也把编译日志公开，便于定位。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & release unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate Xcode project
        run: xcodegen generate

      - name: Show build environment
        run: xcodebuild -version && swift --version

      # 关键：无论成败都把完整日志落盘，并抽出 error 行；本步骤不直接让任务失败。
      - name: Build (no signing, capture log)
        id: build
        run: |
          set +e
          xcodebuild -project JevJarvis.xcodeproj -scheme JevJarvis -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ONLY_ACTIVE_ARCH=NO build > buildlog.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          grep -nE "error:|fatal error:|cannot find|has no member|is ambiguous|missing argument|extra argument" buildlog.txt > builderrors.txt || true
          echo "----- extracted errors -----"
          cat builderrors.txt || true
          echo "----------------------------"

      # 无论编译成功还是失败，都确保有 Release 并上传日志（公开可下载）。
      - name: Publish diagnostics to Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.4-context"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" buildlog.txt builderrors.txt --clobber
          else
            gh release create "$TAG" buildlog.txt builderrors.txt --title "iPhone 聊天助手（含多轮上下文）" --notes "构建日志见附件。"
          fi

      # 编译失败则在此明确失败、终止后续打包。
      - name: Assert build succeeded
        run: test "${{ steps.build.outputs.code }}" = "0"

      - name: Locate app & verify keyboard extension
        id: locate
        run: |
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name 'JevJarvis.app' -type d -path '*Release-iphoneos*' | head -1)
          echo "Found: $APP_PATH"
          test -n "$APP_PATH"
          test -d "$APP_PATH/PlugIns/JevKeyboard.appex"
          ls -la "$APP_PATH/PlugIns"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package IPA
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          mkdir -p staging/Payload
          cp -R "$APP_PATH" staging/Payload/
          (cd staging && zip -qr ../JevJarvis-unsigned.ipa Payload)
          unzip -l JevJarvis-unsigned.ipa | head -20

      - name: Publish IPA to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.4-context"
          gh release upload "$TAG" JevJarvis-unsigned.ipa --clobber

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JevJarvis-unsigned-ipa
          path: JevJarvis-unsigned.ipa
          retention-days: 30
