name: Build iOS IPA

# 在云端 Mac 上编译「未签名 IPA」并发到 Release；失败也把编译日志公开，便于定位。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & release unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate Xcode project
        run: xcodegen generate

      - name: Show build environment
        run: xcodebuild -version && swift --version

      # 关键：无论成败都把完整日志落盘，并抽出 error 行；用固定 derivedDataPath 便于定位产物。
      - name: Build (no signing, capture log)
        id: build
        run: |
          set +e
          xcodebuild -project JevJarvis.xcodeproj \
            -scheme JevJarvis \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > buildlog.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          grep -nE "error:|fatal error:|cannot find|has no member|is ambiguous|missing argument|extra argument" buildlog.txt > builderrors.txt || true
          echo "----- extracted errors -----"
          cat builderrors.txt || true
          echo "----------------------------"

      # 无论成败都确保有 Release 并上传日志（公开可下载）。加重试，且永不阻断后续步骤。
      - name: Publish diagnostics to Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.4-context"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "iPhone 聊天助手（含多轮上下文）" --notes "见附件 IPA 与构建日志。"
          for f in buildlog.txt builderrors.txt; do
            ok=0
            for i in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber; then ok=1; break; fi
              echo "upload $f attempt $i failed, retrying..."; sleep 3
            done
            if [ "$ok" = "0" ]; then echo "WARN: could not upload $f"; fi
          done
          true

      # 编译失败则明确失败、终止打包。
      - name: Assert build succeeded
        run: test "${{ steps.build.outputs.code }}" = "0"

      - name: Locate app & verify keyboard extension
        id: locate
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -1)
          echo "Built app: $APP_PATH"
          test -n "$APP_PATH"
          test -d "$APP_PATH/PlugIns/JevKeyboard.appex"
          ls -la "$APP_PATH/PlugIns"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package IPA
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          rm -f JevJarvis-unsigned.ipa
          zip -qr JevJarvis-unsigned.ipa Payload
          unzip -l JevJarvis-unsigned.ipa | head -25

      - name: Publish IPA to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.4-context"
          for i in 1 2 3 4 5 6; do
            if gh release upload "$TAG" JevJarvis-unsigned.ipa --clobber; then
              echo "IPA uploaded"; exit 0
            fi
            echo "IPA upload attempt $i failed, retrying..."; sleep 4
          done
          echo "ERROR: failed to publish IPA"; exit 1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JevJarvis-unsigned-ipa
          path: JevJarvis-unsigned.ipa
          retention-days: 30
